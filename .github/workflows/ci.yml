name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions-lock-verify:
    permissions:
      contents: read # checkout repository to verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.6.0

  ci:
    permissions:
      contents: read # checkout repository for Go CI
    uses: berquerant/reusable-workflows/.github/workflows/go-ci.yml@v0.6.0
    with:
      test-command: make test
